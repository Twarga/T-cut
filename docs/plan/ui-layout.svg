<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 572" role="img" aria-labelledby="title desc" font-family="sans-serif" font-size="14" fill="currentColor">
  <title id="title">Linux Creator Editor conceptual workbench</title>
